<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login Page</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <section class="login-card" aria-labelledby="page-title">
      <div class="brand-icon" aria-hidden="true">🎓</div>
      <p class="eyebrow">STUDENT PORTAL</p>
      <h1 id="page-title">Welcome back</h1>
      <p class="subtitle">Sign in to continue to your student account.</p>

      <form id="login-form" novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required>
        <small class="error" id="email-error"></small>

        <div class="password-heading">
          <label for="password">Password</label>
          <a href="#" id="forgot-link">Forgot password?</a>
        </div>
        <div class="password-wrap">
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" id="toggle-password" class="show-button">Show</button>
        </div>
        <small class="error" id="password-error"></small>

        <label class="remember">
          <input type="checkbox" id="remember">
          <span>Remember me</span>
        </label>

        <button class="submit-button" type="submit">Sign in</button>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      </form>

      <p class="signup-text">New student? <a href="#" id="signup-link">Create an account</a></p>
      <p class="demo-note">Student demo project · No real account or password is created.</p>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
